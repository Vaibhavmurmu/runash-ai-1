name: CI Security & Reliability

env:
  # Use self-hosted runners by default so CI can still run when GitHub-hosted
  # minutes are unavailable (for example, during billing lock incidents).
  RUNASH_GITHUB_RUNNER: ${{ vars.RUNASH_GITHUB_RUNNER || 'self-hosted' }}

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ${{ env.RUNASH_GITHUB_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run test:auth

  dependency-scan:
    runs-on: ${{ env.RUNASH_GITHUB_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ${{ env.RUNASH_GITHUB_RUNNER }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
