name: Auth OpenAPI Sync

env:
  # Use self-hosted runners by default so CI can still run when GitHub-hosted
  # minutes are unavailable (for example, during billing lock incidents).
  RUNASH_GITHUB_RUNNER: ${{ vars.RUNASH_GITHUB_RUNNER || 'self-hosted' }}

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  openapi-sync:
    runs-on: ${{ env.RUNASH_GITHUB_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run openapi:auth:generate
      - run: git diff --exit-code docs/openapi/auth.openapi.json
